# Pages CMS – Editor für die Website von Ronja Sereinig
# Bearbeiten unter https://app.pagescms.org

media:
  input: src/images/uploads
  output: /images/uploads
  rename: safe
  categories: [image]

content:
  # ================= SEITEN =================

  - name: seite_start
    label: "Seite: Start"
    type: file
    path: src/_data/start.json
    format: json
    fields:
      - { name: menu_label, label: Name im Menü, type: string, description: "So heißt die Seite oben im Menü." }
      - name: hero
        label: "Großer Einstieg (ganz oben)"
        type: object
        fields:
          - { name: eyebrow, label: Kleine Überzeile, type: string }
          - { name: title, label: Überschrift, type: text, description: "Mit Enter einen Zeilenumbruch setzen." }
          - { name: text, label: Text, type: text }
          - { name: button_text, label: Button-Text, type: string }
          - { name: note, label: Kursiver Satz unter dem Button, type: string }
          - { name: image, label: Bild, type: image, description: "Querformat, mind. 1800 px breit. Die Person sollte eher rechts im Bild sein – links steht der Text." }
          - { name: image_alt, label: Bildbeschreibung, type: string, description: "Kurz beschreiben, was zu sehen ist (für Google und blinde Menschen)." }
      - name: intro
        label: "Einleitung (Frage & Text)"
        type: object
        fields:
          - { name: title, label: Überschrift, type: text, description: "Mit Enter einen Zeilenumbruch setzen." }
          - { name: text, label: Text, type: text, description: "Leerzeile = neuer Absatz." }
          - { name: accent, label: Hervorgehobener Satz (kursiv), type: string }
      - { name: testimonials_image, label: "Eigenes Bild für die Erfahrungsberichte (optional)", type: image, description: "Nur für diese Seite. Leer lassen = gemeinsames Bild aus „Erfahrungsberichte“." }
      - { name: testimonials_image_alt, label: "Bildbeschreibung (Erfahrungsberichte)", type: string }
      - { name: cta_image, label: "Eigenes Bild für den Abschluss-Bereich (optional)", type: image, description: "Nur für diese Seite. Leer lassen = gemeinsames Bild aus „Abschluss-Bereich“." }
      - { name: cta_image_alt, label: "Bildbeschreibung (Abschluss-Bereich)", type: string }

  - name: seite_core
    label: "Seite: CORE® Bodywork"
    type: file
    path: src/_data/core.json
    format: json
    fields:
      - { name: menu_label, label: Name im Menü, type: string, description: "So heißt die Seite oben im Menü." }
      - { name: eyebrow, label: Kleine Überzeile, type: string }
      - { name: title, label: Überschrift, type: text }
      - { name: text, label: Text, type: text, description: "Leerzeile = neuer Absatz." }
      - { name: button_text, label: Button-Text, type: string, description: "Leer lassen = kein Button." }
      - { name: button_link, label: Button-Link, type: string, description: "z. B. /sessions/, /kontakt/, /ueber-mich/ oder eine volle Web-Adresse." }
      - { name: image, label: Bild, type: image, description: "Querformat. Das Bild läuft nach rechts weich aus. Erscheint auch als Kachel auf der Startseite." }
      - { name: image_alt, label: Bildbeschreibung, type: string }
      - { name: more_title, label: Zusatzbereich – Überschrift (optional), type: string, description: "Erscheint unter dem Hauptbereich. Leer lassen = kein Zusatzbereich." }
      - { name: more_text, label: Zusatzbereich – Text (optional), type: text, description: "Für mehr Text auf dieser Seite. Leerzeile = neuer Absatz." }
      - { name: cta_image, label: "Eigenes Bild für den Abschluss-Bereich (optional)", type: image, description: "Nur für diese Seite. Leer lassen = gemeinsames Bild aus „Abschluss-Bereich“." }
      - { name: cta_image_alt, label: "Bildbeschreibung (Abschluss-Bereich)", type: string }

  - name: seite_about
    label: "Seite: Über mich"
    type: file
    path: src/_data/about.json
    format: json
    fields:
      - { name: menu_label, label: Name im Menü, type: string, description: "So heißt die Seite oben im Menü." }
      - { name: eyebrow, label: Kleine Überzeile, type: string }
      - { name: title, label: Überschrift, type: text }
      - { name: text, label: Text, type: text, description: "Leerzeile = neuer Absatz." }
      - { name: button_text, label: Button-Text, type: string, description: "Leer lassen = kein Button." }
      - { name: button_link, label: Button-Link, type: string, description: "z. B. /kontakt/, /sessions/ oder eine volle Web-Adresse." }
      - { name: image, label: Bild, type: image, description: "Querformat. Das Bild läuft nach links weich aus. Erscheint auch als Kachel auf der Startseite." }
      - { name: image_alt, label: Bildbeschreibung, type: string }
      - { name: more_title, label: Zusatzbereich – Überschrift (optional), type: string, description: "Erscheint unter dem Hauptbereich. Leer lassen = kein Zusatzbereich." }
      - { name: more_text, label: Zusatzbereich – Text (optional), type: text, description: "Für mehr Text auf dieser Seite. Leerzeile = neuer Absatz." }
      - { name: cta_image, label: "Eigenes Bild für den Abschluss-Bereich (optional)", type: image, description: "Nur für diese Seite. Leer lassen = gemeinsames Bild aus „Abschluss-Bereich“." }
      - { name: cta_image_alt, label: "Bildbeschreibung (Abschluss-Bereich)", type: string }

  - name: seite_sessions
    label: "Seite: 1:1 Sessions"
    type: file
    path: src/_data/sessions.json
    format: json
    fields:
      - { name: menu_label, label: Name im Menü, type: string, description: "So heißt die Seite oben im Menü." }
      - { name: eyebrow, label: Kleine Überzeile, type: string }
      - { name: title, label: Überschrift, type: text }
      - name: items
        label: Merkmale
        description: "Ideal sind 3–5 Einträge."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{text}"
        fields:
          - name: icon
            label: Symbol
            type: select
            options:
              values:
                - { name: herz, label: Herz }
                - { name: blatt, label: Blatt }
                - { name: uhr, label: Uhr }
                - { name: ort, label: Ort / Pin }
                - { name: sonne, label: Sonne }
                - { name: hand, label: Hand mit Herz }
                - { name: kalender, label: Kalender }
                - { name: stern, label: Stern }
          - { name: text, label: Text, type: text, description: "Mit Enter einen Zeilenumbruch setzen." }
      - { name: button_text, label: Button-Text, type: string }
      - { name: image, label: Bild für die Kachel auf der Startseite, type: image }
      - { name: image_alt, label: Bildbeschreibung, type: string }
      - { name: more_title, label: Zusatzbereich – Überschrift (optional), type: string, description: "Erscheint unter dem Hauptbereich. Leer lassen = kein Zusatzbereich." }
      - { name: more_text, label: Zusatzbereich – Text (optional), type: text, description: "Für mehr Text auf dieser Seite. Leerzeile = neuer Absatz." }
      - { name: testimonials_image, label: "Eigenes Bild für die Erfahrungsberichte (optional)", type: image, description: "Nur für diese Seite. Leer lassen = gemeinsames Bild aus „Erfahrungsberichte“." }
      - { name: testimonials_image_alt, label: "Bildbeschreibung (Erfahrungsberichte)", type: string }
      - { name: cta_image, label: "Eigenes Bild für den Abschluss-Bereich (optional)", type: image, description: "Nur für diese Seite. Leer lassen = gemeinsames Bild aus „Abschluss-Bereich“." }
      - { name: cta_image_alt, label: "Bildbeschreibung (Abschluss-Bereich)", type: string }

  - name: seite_kontakt
    label: "Seite: Kontakt"
    type: file
    path: src/_data/contact.json
    format: json
    fields:
      - { name: menu_label, label: Name im Menü, type: string, description: "So heißt die Seite oben im Menü." }
      - { name: eyebrow, label: Kleine Überzeile, type: string }
      - { name: title, label: Überschrift, type: string }
      - { name: text, label: Text, type: text }
      - { name: button_text, label: Button-Text, type: string }
      - { name: mail_subject, label: Betreff der E-Mail, type: string, description: "Wird automatisch in die E-Mail eingesetzt, wenn jemand auf den Button klickt." }

  # ================= BEREICHE AUF MEHREREN SEITEN =================

  - name: erfahrungen
    label: "Erfahrungsberichte (Start & Sessions)"
    type: file
    path: src/_data/testimonials.json
    format: json
    fields:
      - { name: eyebrow, label: Kleine Überzeile, type: string }
      - { name: image, label: Bild (links), type: image }
      - { name: image_alt, label: Bildbeschreibung, type: string }
      - name: items
        label: Erfahrungsberichte
        description: "Ohne Einträge wird der Bereich ausgeblendet."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{quote}"
        fields:
          - { name: quote, label: Zitat (ohne Anführungszeichen), type: text }
          - { name: name, label: Name / Initialen (optional), type: string }
      - { name: feedback_link_text, label: Link zum Feedback-Formular, type: string, description: "Kleiner Link unter den Erfahrungsberichten. Leer lassen = kein Link." }

  - name: abschluss
    label: "Abschluss-Bereich (dunkler Bereich unten)"
    type: file
    path: src/_data/cta.json
    format: json
    fields:
      - { name: title, label: "Satz (kursiv, groß)", type: text }
      - { name: button_text, label: Button-Text, type: string }
      - { name: image, label: Bild, type: image }
      - { name: image_alt, label: Bildbeschreibung, type: string }

  # ================= DESIGN =================
  - name: design
    label: Design (Farben & Schrift)
    type: file
    path: src/_data/design.json
    format: json
    fields:
      # ---- Die wichtigsten zwei Einstellungen ----
      - name: palette
        label: Farbpalette
        description: "Ändert alle Farben der Website auf einmal. Vorschaubilder findest du im Handbuch (Kapitel 6)."
        type: select
        options:
          values:
            - { name: erdtoene, label: "Erdtöne – warmes Braun (Standard)" }
            - { name: terrakotta, label: "Terrakotta – warmes Orange-Rot" }
            - { name: pfirsich, label: "Pfirsich – sanftes Apricot" }
            - { name: rose, label: "Rosé – zartes Altrosa" }
            - { name: lavendel, label: "Lavendel – helles Violett" }
            - { name: salbei, label: "Salbei – sanftes Grün" }
            - { name: olive, label: "Olive – erdiges Gelbgrün" }
            - { name: wald, label: "Waldgrün – tiefes Grün" }
            - { name: meer, label: "Sand & Meer – Beige mit Blaugrau" }
            - { name: nachtblau, label: "Nachtblau – kühles Blau" }
            - { name: gold, label: "Creme & Gold – hell mit Goldton" }
            - { name: stein, label: "Stein – schlichtes Grau" }
      - name: fonts
        label: Schrift
        description: "Schrift für Überschriften und Text. Vorschaubilder im Handbuch (Kapitel 6)."
        type: select
        options:
          values:
            - { name: elegant, label: "Elegant – Cormorant Garamond + Jost (Standard)" }
            - { name: klassisch, label: "Klassisch – Lora + Source Sans" }
            - { name: zeitlos, label: "Zeitlos – EB Garamond + Karla" }
            - { name: modern, label: "Modern – Playfair Display + Montserrat" }
            - { name: edel, label: "Edel – Bodoni Moda + Raleway" }
            - { name: weich, label: "Weich – Fraunces + Nunito" }
            - { name: ruhig, label: "Ruhig – Spectral + Work Sans" }
            - { name: schlicht, label: "Schlicht – DM Sans (ohne Serifen)" }

      # ---- Feinschliff (optional) ----
      - name: text_size
        label: "Feinschliff: Textgröße"
        type: select
        options:
          values:
            - { name: klein, label: "Klein" }
            - { name: normal, label: "Normal (Standard)" }
            - { name: gross, label: "Groß – besser lesbar" }
      - name: buttons
        label: "Feinschliff: Form der Buttons"
        type: select
        options:
          values:
            - { name: rund, label: "Rund (Standard)" }
            - { name: weich, label: "Leicht abgerundet" }
            - { name: eckig, label: "Eckig" }
      - name: corners
        label: "Feinschliff: Ecken von Kacheln und Feldern"
        type: select
        options:
          values:
            - { name: rund, label: "Rund (Standard)" }
            - { name: weich, label: "Leicht abgerundet" }
            - { name: eckig, label: "Eckig" }
      - name: spacing
        label: "Feinschliff: Abstände"
        type: select
        options:
          values:
            - { name: kompakt, label: "Kompakt – weniger Platz zwischen den Bereichen" }
            - { name: normal, label: "Normal (Standard)" }
            - { name: luftig, label: "Luftig – mehr Platz zwischen den Bereichen" }
      - name: image_fade
        label: "Feinschliff: Bilder neben Texten"
        type: select
        options:
          values:
            - { name: weich, label: "Mit weichem Verlauf (Standard)" }
            - { name: ohne, label: "Ohne Verlauf – klare Kante" }

      # ---- Eigene Farben (optional) ----
      - name: accent
        label: "Eigene Farbe: Akzentfarbe (optional)"
        description: "Buttons, Überzeilen, Symbole, z. B. #7d4a35. Leer lassen = Farbe der Palette. Farbcodes: htmlcolorcodes.com"
        type: string
        pattern:
          regex: "^(#[0-9a-fA-F]{6})?$"
          message: "Bitte einen Farbcode mit # und 6 Zeichen eingeben, z. B. #7d4a35 – oder das Feld leer lassen."
      - name: custom_colors
        label: "Eigene Farben: weitere (optional, für Fortgeschrittene)"
        description: "Jedes Feld überschreibt eine Farbe der Palette. Leer lassen = Farbe der Palette. Tipp: Hintergründe hell, Text und dunkle Bereiche dunkel wählen."
        type: object
        fields:
          - name: background
            label: "Hintergrund"
            description: "Heller Haupt-Hintergrund, z. B. #f3ece5"
            type: string
            pattern:
              regex: "^(#[0-9a-fA-F]{6})?$"
              message: "Bitte einen Farbcode mit # und 6 Zeichen eingeben, z. B. #7d4a35 – oder das Feld leer lassen."
          - name: background_alt
            label: "Zweiter Hintergrund"
            description: "Etwas dunklerer Hintergrund für abwechselnde Bereiche, z. B. #ede3da"
            type: string
            pattern:
              regex: "^(#[0-9a-fA-F]{6})?$"
              message: "Bitte einen Farbcode mit # und 6 Zeichen eingeben, z. B. #7d4a35 – oder das Feld leer lassen."
          - name: text
            label: "Textfarbe"
            description: "Überschriften und Text, z. B. #2e211b"
            type: string
            pattern:
              regex: "^(#[0-9a-fA-F]{6})?$"
              message: "Bitte einen Farbcode mit # und 6 Zeichen eingeben, z. B. #7d4a35 – oder das Feld leer lassen."
          - name: dark
            label: "Dunkle Bereiche"
            description: "Großer Einstieg oben, Abschluss-Bereich und Fußbereich, z. B. #2a1d17"
            type: string
            pattern:
              regex: "^(#[0-9a-fA-F]{6})?$"
              message: "Bitte einen Farbcode mit # und 6 Zeichen eingeben, z. B. #7d4a35 – oder das Feld leer lassen."

  # ================= FEEDBACK =================

  - name: feedback
    label: Feedback-Seite
    type: file
    path: src/_data/feedback.json
    format: json
    fields:
      - { name: eyebrow, label: Kleine Überzeile, type: string }
      - { name: title, label: Überschrift, type: text }
      - { name: intro, label: Einleitungstext, type: text, description: "Leerzeile = neuer Absatz." }
      - { name: message_label, label: Beschriftung Textfeld, type: string }
      - { name: message_placeholder, label: Platzhalter im Textfeld, type: string }
      - { name: name_label, label: Beschriftung Namensfeld, type: string }
      - { name: consent_label, label: Text beim Häkchen (Veröffentlichung erlaubt), type: string }
      - { name: button_text, label: Button-Text, type: string }
      - { name: success_title, label: Überschrift nach dem Absenden, type: string }
      - { name: success_text, label: Text nach dem Absenden, type: text }
      - { name: error_text, label: Text bei einem Fehler, type: string }
      - { name: not_ready_text, label: Text solange kein Schlüssel eingetragen ist, type: string }

  # ================= RECHTLICHES =================

  - name: impressum
    label: Impressum
    type: file
    path: src/rechtliches/impressum.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Titel, type: string }
      - { name: body, label: Inhalt, type: rich-text }

  - name: datenschutz
    label: Datenschutzerklärung
    type: file
    path: src/rechtliches/datenschutz.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Titel, type: string }
      - { name: body, label: Inhalt, type: rich-text }

  # ================= EINSTELLUNGEN =================

  - name: einstellungen
    label: Einstellungen
    type: file
    path: src/_data/settings.json
    format: json
    fields:
      - { name: logo_name, label: Name (Logo), type: string }
      - { name: logo_subtitle, label: Untertitel (Logo), type: string }
      - { name: header_button_text, label: Button oben rechts, type: string }
      - { name: contact_link, label: "Wohin führen die Anfrage-Buttons?", type: string, description: "/kontakt/ = zur Kontaktseite. Alternativ z. B. ein Buchungslink (Calendly o. Ä.)." }
      - { name: contact_email, label: E-Mail-Adresse, type: string }
      - { name: phone, label: Telefon (optional), type: string, description: "Leer lassen, wenn keine Nummer angezeigt werden soll." }
      - { name: feedback_key, label: Feedback-Schlüssel (Web3Forms), type: string, description: "Kostenlos auf web3forms.com anfordern – der Schlüssel kommt per E-Mail. Hier einfügen, dann ist das Feedback-Formular aktiv." }
      - { name: instagram_handle, label: Instagram-Name, type: string, description: "z. B. @ronja.sereinig" }
      - { name: instagram_url, label: Instagram-Link, type: string, description: "Leer lassen blendet Instagram aus." }
      - { name: instagram_label, label: Instagram-Beschriftung, type: string }
      - { name: site_title, label: "Seitentitel (Browser-Tab & Google)", type: string }
      - { name: meta_description, label: Beschreibung für Google, type: text, description: "ca. 150 Zeichen" }
      - { name: share_image, label: "Vorschaubild beim Teilen (WhatsApp, Facebook …)", type: image }


