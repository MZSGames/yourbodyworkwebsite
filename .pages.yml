      - { name: show, label: "Seite anzeigen", type: boolean, description: "Angehakt = die Seite Workshops ist online und steht im Menü und als Kachel auf der Startseite." }
      - { name: menu_label, label: Name im Menü, type: string, description: "So heißt die Seite oben im Menü." }
