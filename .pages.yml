# Pages CMS – Editor für die Website von Ronja Sereinig
# Bearbeiten unter https://app.pagescms.org

media:
  input: src/images/uploads
  output: /images/uploads
  rename: safe
  categories: [image]

content:
  # ================= SEITEN (Reihenfolge wie im Menü) =================
  - name: seite_start
    label: "Seite: Start"
    type: file
    path: src/_data/start.json
    format: json
    fields:
      - { name: menu_label, label: Name im Menü, type: string, description: "So heißt die Seite oben im Menü." }
      - name: hero
        label: "Großer Einstieg (ganz oben)"
        type: object
        fields:
          - { name: eyebrow, label: Kleine Überzeile, type: string }
          - { name: title, label: Überschrift, type: text, description: "Mit Enter einen Zeilenumbruch setzen." }
          - { name: text, label: Text, type: text }
          - { name: button_text, label: Button-Text, type: string }
          - { name: note, label: Kursiver Satz unter dem Button, type: string }
          - { name: image, label: Bild, type: image, description: "Querformat, mind. 1800 px breit. Die Person sollte eher rechts im Bild sein – links steht der Text." }
          - { name: image_alt, label: Bildbeschreibung, type: string, description: "Kurz beschreiben, was zu sehen ist (für Google und blinde Menschen)." }
          - name: image_focus
            label: "Bildausschnitt"
            description: "Welcher Teil des Bildes sichtbar bleibt, wenn es zugeschnitten wird. Bei Hochkant-Porträts meist „Oben“. Leer = Mitte."
            type: select
            options:
              values:
                - { name: oben-links, label: "↖ Oben links" }
                - { name: oben, label: "↑ Oben (z. B. Gesicht bei Hochkant-Fotos)" }
                - { name: oben-rechts, label: "↗ Oben rechts" }
                - { name: links, label: "← Links" }
                - { name: mitte, label: "● Mitte (Standard)" }
                - { name: rechts, label: "→ Rechts" }
                - { name: unten-links, label: "↙ Unten links" }
                - { name: unten, label: "↓ Unten" }
                - { name: unten-rechts, label: "↘ Unten rechts" }
      - name: intro
        label: "Einleitung (Frage & Text)"
        type: object
        fields:
          - { name: title, label: Überschrift, type: text, description: "Mit Enter einen Zeilenumbruch setzen." }
          - { name: text, label: Text, type: text, description: "Leerzeile = neuer Absatz." }
          - { name: accent, label: Hervorgehobener Satz (kursiv), type: string }
      - { name: testimonials_image, label: "Eigenes Bild für die Erfahrungsberichte (optional)", type: image, description: "Nur für diese Seite. Leer lassen = gemeinsames Bild aus „Erfahrungsberichte“." }
      - { name: testimonials_image_alt, label: "Bildbeschreibung (Erfahrungsberichte)", type: string }
      - name: testimonials_image_focus
        label: "Bildausschnitt"
        description: "Welcher Teil des Bildes sichtbar bleibt, wenn es zugeschnitten wird. Bei Hochkant-Porträts meist „Oben“. Leer = Mitte."
        type: select
        options:
          values:
            - { name: oben-links, label: "↖ Oben links" }
            - { name: oben, label: "↑ Oben (z. B. Gesicht bei Hochkant-Fotos)" }
            - { name: oben-rechts, label: "↗ Oben rechts" }
            - { name: links, label: "← Links" }
            - { name: mitte, label: "● Mitte (Standard)" }
            - { name: rechts, label: "→ Rechts" }
            - { name: unten-links, label: "↙ Unten links" }
            - { name: unten, label: "↓ Unten" }
            - { name: unten-rechts, label: "↘ Unten rechts" }
      - { name: cta_image, label: "Eigenes Bild für den Abschluss-Bereich (optional)", type: image, description: "Nur für diese Seite. Leer lassen = gemeinsames Bild aus „Abschluss-Bereich“." }
      - { name: cta_image_alt, label: "Bildbeschreibung (Abschluss-Bereich)", type: string }
      - name: cta_image_focus
        label: "Bildausschnitt"
        description: "Welcher Teil des Bildes sichtbar bleibt, wenn es zugeschnitten wird. Bei Hochkant-Porträts meist „Oben“. Leer = Mitte."
        type: select
        options:
          values:
            - { name: oben-links, label: "↖ Oben links" }
            - { name: oben, label: "↑ Oben (z. B. Gesicht bei Hochkant-Fotos)" }
            - { name: oben-rechts, label: "↗ Oben rechts" }
            - { name: links, label: "← Links" }
            - { name: mitte, label: "● Mitte (Standard)" }
            - { name: rechts, label: "→ Rechts" }
            - { name: unten-links, label: "↙ Unten links" }
            - { name: unten, label: "↓ Unten" }
            - { name: unten-rechts, label: "↘ Unten rechts" }

  - name: seite_about
    label: "Seite: Über mich"
    type: file
    path: src/_data/about.json
    format: json
    fields:
      - { name: show, label: "Seite anzeigen", type: boolean, description: "Angehakt = die Seite Über mich ist online und steht im Menü. Nicht angehakt = sie ist ausgeblendet, deine Inhalte bleiben gespeichert." }
      - { name: menu_label, label: Name im Menü, type: string, description: "So heißt die Seite oben im Menü." }
      - { name: eyebrow, label: Kleine Überzeile, type: string }
      - { name: title, label: Überschrift, type: text }
      - { name: text, label: Text, type: text, description: "Leerzeile = neuer Absatz." }
      - { name: button_text, label: Button-Text, type: string, description: "Leer lassen = kein Button." }
      - { name: button_link, label: Button-Link, type: string, description: "z. B. /kontakt/, /sessions/ oder eine volle Web-Adresse." }
      - { name: image, label: Bild, type: image, description: "Querformat. Das Bild läuft nach links weich aus. Erscheint auch als Kachel auf der Startseite." }
      - { name: image_alt, label: Bildbeschreibung, type: string }
      - name: image_focus
        label: "Bildausschnitt"
        description: "Welcher Teil des Bildes sichtbar bleibt, wenn es zugeschnitten wird. Bei Hochkant-Porträts meist „Oben“. Leer = Mitte."
        type: select
        options:
          values:
            - { name: oben-links, label: "↖ Oben links" }
            - { name: oben, label: "↑ Oben (z. B. Gesicht bei Hochkant-Fotos)" }
            - { name: oben-rechts, label: "↗ Oben rechts" }
            - { name: links, label: "← Links" }
            - { name: mitte, label: "● Mitte (Standard)" }
            - { name: rechts, label: "→ Rechts" }
            - { name: unten-links, label: "↙ Unten links" }
            - { name: unten, label: "↓ Unten" }
            - { name: unten-rechts, label: "↘ Unten rechts" }
      - { name: more_title, label: Zusatzbereich – Überschrift (optional), type: string, description: "Erscheint unter dem Hauptbereich. Leer lassen = kein Zusatzbereich." }
      - { name: more_text, label: Zusatzbereich – Text (optional), type: text, description: "Für mehr Text auf dieser Seite. Leerzeile = neuer Absatz." }
      - { name: cta_image, label: "Eigenes Bild für den Abschluss-Bereich (optional)", type: image, description: "Nur für diese Seite. Leer lassen = gemeinsames Bild aus „Abschluss-Bereich“." }
      - { name: cta_image_alt, label: "Bildbeschreibung (Abschluss-Bereich)", type: string }
      - name: cta_image_focus
        label: "Bildausschnitt"
        description: "Welcher Teil des Bildes sichtbar bleibt, wenn es zugeschnitten wird. Bei Hochkant-Porträts meist „Oben“. Leer = Mitte."
        type: select
        options:
          values:
            - { name: oben-links, label: "↖ Oben links" }
            - { name: oben, label: "↑ Oben (z. B. Gesicht bei Hochkant-Fotos)" }
            - { name: oben-rechts, label: "↗ Oben rechts" }
            - { name: links, label: "← Links" }
            - { name: mitte, label: "● Mitte (Standard)" }
            - { name: rechts, label: "→ Rechts" }
            - { name: unten-links, label: "↙ Unten links" }
            - { name: unten, label: "↓ Unten" }
            - { name: unten-rechts, label: "↘ Unten rechts" }

      # ---- Zweites Bild (optional) ----
      - { name: image2_show, label: "Zweites Bild: anzeigen", type: boolean, description: "Zeigt das zweite Bild neben dem Zusatzbereich (Überschrift + Text weiter oben)." }
      - { name: image2, label: "Zweites Bild", type: image }
      - { name: image2_alt, label: "Zweites Bild: Bildbeschreibung", type: string }
      - name: image2_focus
        label: "Bildausschnitt"
        description: "Welcher Teil des Bildes sichtbar bleibt, wenn es zugeschnitten wird. Leer = Mitte."
        type: select
        options:
          values:
            - { name: oben-links, label: "↖ Oben links" }
            - { name: oben, label: "↑ Oben (z. B. Gesicht bei Hochkant-Fotos)" }
            - { name: oben-rechts, label: "↗ Oben rechts" }
            - { name: links, label: "← Links" }
            - { name: mitte, label: "● Mitte (Standard)" }
            - { name: rechts, label: "→ Rechts" }
            - { name: unten-links, label: "↙ Unten links" }
            - { name: unten, label: "↓ Unten" }
            - { name: unten-rechts, label: "↘ Unten rechts" }

      # ---- Bildergalerie (optional) ----
      - { name: gallery_show, label: "Bildergalerie: anzeigen", type: boolean }
      - { name: gallery_title, label: "Bildergalerie: Überschrift", type: string }
      - { name: gallery_text, label: "Bildergalerie: Text (optional)", type: text }
      - name: gallery
        label: "Bildergalerie: Fotos"
        description: "Beliebig viele Fotos. Ein Klick auf der Website zeigt das Foto groß."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{image_alt}"
        fields:
          - { name: image, label: Foto, type: image }
          - { name: image_alt, label: Bildbeschreibung, type: string }

  - name: seite_sessions
    label: "Seite: 1:1 Sessions"
    type: file
    path: src/_data/sessions.json
    format: json
    fields:
      - { name: show, label: "Seite anzeigen", type: boolean, description: "Angehakt = die Seite 1:1 Sessions ist online und steht im Menü. Nicht angehakt = sie ist ausgeblendet, deine Inhalte bleiben gespeichert." }
      - { name: menu_label, label: Name im Menü, type: string, description: "So heißt die Seite oben im Menü." }
      - { name: eyebrow, label: Kleine Überzeile, type: string }
      - { name: title, label: Überschrift, type: text }
      - name: items
        label: Merkmale
        description: "Ideal sind 3–5 Einträge."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{text}"
        fields:
          - name: icon
            label: Symbol
            type: select
            options:
              values:
                - { name: herz, label: Herz }
                - { name: blatt, label: Blatt }
                - { name: uhr, label: Uhr }
                - { name: ort, label: Ort / Pin }
                - { name: sonne, label: Sonne }
                - { name: hand, label: Hand mit Herz }
                - { name: kalender, label: Kalender }
                - { name: stern, label: Stern }
          - { name: text, label: Text, type: text, description: "Mit Enter einen Zeilenumbruch setzen." }
      - { name: button_text, label: Button-Text, type: string }
      - { name: image, label: Bild für die Kachel auf der Startseite, type: image }
      - { name: image_alt, label: Bildbeschreibung, type: string }
      - name: image_focus
        label: "Bildausschnitt"
        description: "Welcher Teil des Bildes sichtbar bleibt, wenn es zugeschnitten wird. Bei Hochkant-Porträts meist „Oben“. Leer = Mitte."
        type: select
        options:
          values:
            - { name: oben-links, label: "↖ Oben links" }
            - { name: oben, label: "↑ Oben (z. B. Gesicht bei Hochkant-Fotos)" }
            - { name: oben-rechts, label: "↗ Oben rechts" }
            - { name: links, label: "← Links" }
            - { name: mitte, label: "● Mitte (Standard)" }
            - { name: rechts, label: "→ Rechts" }
            - { name: unten-links, label: "↙ Unten links" }
            - { name: unten, label: "↓ Unten" }
            - { name: unten-rechts, label: "↘ Unten rechts" }
      - { name: more_title, label: Zusatzbereich – Überschrift (optional), type: string, description: "Erscheint unter dem Hauptbereich. Leer lassen = kein Zusatzbereich." }
      - { name: more_text, label: Zusatzbereich – Text (optional), type: text, description: "Für mehr Text auf dieser Seite. Leerzeile = neuer Absatz." }
      - { name: testimonials_image, label: "Eigenes Bild für die Erfahrungsberichte (optional)", type: image, description: "Nur für diese Seite. Leer lassen = gemeinsames Bild aus „Erfahrungsberichte“." }
      - { name: testimonials_image_alt, label: "Bildbeschreibung (Erfahrungsberichte)", type: string }
      - name: testimonials_image_focus
        label: "Bildausschnitt"
        description: "Welcher Teil des Bildes sichtbar bleibt, wenn es zugeschnitten wird. Bei Hochkant-Porträts meist „Oben“. Leer = Mitte."
        type: select
        options:
          values:
            - { name: oben-links, label: "↖ Oben links" }
            - { name: oben, label: "↑ Oben (z. B. Gesicht bei Hochkant-Fotos)" }
            - { name: oben-rechts, label: "↗ Oben rechts" }
            - { name: links, label: "← Links" }
            - { name: mitte, label: "● Mitte (Standard)" }
            - { name: rechts, label: "→ Rechts" }
            - { name: unten-links, label: "↙ Unten links" }
            - { name: unten, label: "↓ Unten" }
            - { name: unten-rechts, label: "↘ Unten rechts" }
      - { name: cta_image, label: "Eigenes Bild für den Abschluss-Bereich (optional)", type: image, description: "Nur für diese Seite. Leer lassen = gemeinsames Bild aus „Abschluss-Bereich“." }
      - { name: cta_image_alt, label: "Bildbeschreibung (Abschluss-Bereich)", type: string }
      - name: cta_image_focus
        label: "Bildausschnitt"
        description: "Welcher Teil des Bildes sichtbar bleibt, wenn es zugeschnitten wird. Bei Hochkant-Porträts meist „Oben“. Leer = Mitte."
        type: select
        options:
          values:
            - { name: oben-links, label: "↖ Oben links" }
            - { name: oben, label: "↑ Oben (z. B. Gesicht bei Hochkant-Fotos)" }
            - { name: oben-rechts, label: "↗ Oben rechts" }
            - { name: links, label: "← Links" }
            - { name: mitte, label: "● Mitte (Standard)" }
            - { name: rechts, label: "→ Rechts" }
            - { name: unten-links, label: "↙ Unten links" }
            - { name: unten, label: "↓ Unten" }
            - { name: unten-rechts, label: "↘ Unten rechts" }

      # ---- Online-Kalender (optional) ----
      - { name: booking_show, label: "Online-Kalender: Button anzeigen", type: boolean, description: "Zeigt einen zusätzlichen Button bei den Sessions, z. B. zu Calendly." }
      - { name: booking_text, label: "Online-Kalender: Button-Text", type: string }
      - { name: booking_link, label: "Online-Kalender: Link", type: string, description: "Die Adresse deines Online-Kalenders, z. B. https://calendly.com/… – wird in einem neuen Fenster geöffnet." }

      # ---- Reihenfolge ----
      - { name: testimonials_first, label: "Erfahrungsberichte vor den Sessions zeigen", type: boolean, description: "Nur wenn bei „Seite: Erfahrungen“ auch „Auf der Seite 1:1 Sessions zeigen“ angehakt ist." }

      # ---- Preise (optional) ----
      - { name: prices_show, label: "Preise: Bereich anzeigen", type: boolean }
      - { name: prices_eyebrow, label: "Preise: Kleine Überzeile", type: string }
      - { name: prices_title, label: "Preise: Überschrift", type: string }
      - { name: prices_text, label: "Preise: Einleitungstext (optional)", type: text }
      - name: prices
        label: "Preise: Angebote"
        description: "Beliebig viele Angebote. Ideal sind 2–4."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} – {price}"
        fields:
          - { name: title, label: Titel, type: string, description: "z. B. 1:1 Session" }
          - { name: price, label: Preis, type: string, description: "z. B. 120 € oder ab 90 €" }
          - { name: text, label: Kurze Beschreibung, type: text }
          - { name: highlight, label: Hervorheben, type: boolean, description: "Rahmen in der Akzentfarbe, z. B. für dein beliebtestes Angebot." }
      - { name: prices_note, label: "Preise: Hinweis unter den Angeboten (optional)", type: string, description: "z. B. Alle Preise inkl. MwSt." }

      # ---- Häufige Fragen (optional) ----
      - { name: faq_show, label: "Häufige Fragen: Bereich anzeigen", type: boolean }
      - { name: faq_eyebrow, label: "Häufige Fragen: Kleine Überzeile", type: string }
      - { name: faq_title, label: "Häufige Fragen: Überschrift", type: string }
      - name: faq
        label: "Häufige Fragen: Fragen & Antworten"
        description: "Beliebig viele. Auf der Website lassen sie sich aufklappen."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - { name: question, label: Frage, type: string }
          - { name: answer, label: Antwort, type: text, description: "Leerzeile = neuer Absatz." }

  - name: erfahrungen
    label: "Seite: Erfahrungen & Feedbacks"
    type: file
    path: src/_data/testimonials.json
    format: json
    fields:
      - { name: show, label: "Seite anzeigen", type: boolean, description: "Angehakt = die Seite Erfahrungen & Feedbacks ist online und steht im Menü. Nicht angehakt = sie ist ausgeblendet, deine Inhalte bleiben gespeichert. Die Zitate auf der Startseite stellst du weiter unten separat ein." }
      - { name: menu_label, label: Name im Menü, type: string, description: "So heißt die Seite oben im Menü." }
      - { name: page_eyebrow, label: "Seite: Kleine Überzeile", type: string }
      - { name: page_title, label: "Seite: Überschrift", type: text, description: "Mit Enter einen Zeilenumbruch setzen." }
      - { name: page_text, label: "Seite: Einleitungstext", type: text, description: "Leerzeile = neuer Absatz." }
      - { name: eyebrow, label: Kleine Überzeile, type: string }
      - { name: image, label: Bild, type: image, description: "Erscheint oben auf der Seite Erfahrungen und links neben den Zitaten auf Start/Sessions." }
      - { name: image_alt, label: Bildbeschreibung, type: string }
      - name: image_focus
        label: "Bildausschnitt"
        description: "Welcher Teil des Bildes sichtbar bleibt, wenn es zugeschnitten wird. Bei Hochkant-Porträts meist „Oben“. Leer = Mitte."
        type: select
        options:
          values:
            - { name: oben-links, label: "↖ Oben links" }
            - { name: oben, label: "↑ Oben (z. B. Gesicht bei Hochkant-Fotos)" }
            - { name: oben-rechts, label: "↗ Oben rechts" }
            - { name: links, label: "← Links" }
            - { name: mitte, label: "● Mitte (Standard)" }
            - { name: rechts, label: "→ Rechts" }
            - { name: unten-links, label: "↙ Unten links" }
            - { name: unten, label: "↓ Unten" }
            - { name: unten-rechts, label: "↘ Unten rechts" }
      - name: items
        label: Erfahrungsberichte
        description: "Ohne Einträge wird der Bereich ausgeblendet."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{quote}"
        fields:
          - { name: quote, label: Zitat (ohne Anführungszeichen), type: text }
          - { name: name, label: Name / Initialen (optional), type: string }
      - { name: feedback_link_text, label: Link zum Feedback-Formular, type: string, description: "Kleiner Link unter den Erfahrungsberichten. Leer lassen = kein Link." }

      # ---- Video-Erfahrungen (optional) ----
      - { name: videos_show, label: "Videos: anzeigen", type: boolean, description: "Zeigt Videos von YouTube auf der Seite Erfahrungen." }
      - { name: videos_title, label: "Videos: Überschrift", type: string }
      - { name: videos_note, label: "Videos: Datenschutz-Hinweis", type: string, description: "Erscheint auf jedem Video, bevor es abgespielt wird." }
      - name: videos
        label: "Videos"
        description: "YouTube-Link einfügen (z. B. https://youtu.be/…). Tipp: Video auf YouTube als „Nicht gelistet“ hochladen. Einverständnis der Kundin einholen!"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: youtube, label: YouTube-Link, type: string }
          - { name: title, label: "Titel / Name (optional)", type: string, description: "z. B. „Anna erzählt von ihrer Session“" }
          - { name: image, label: "Vorschaubild (optional)", type: image, description: "Eigenes Bild, das vor dem Abspielen gezeigt wird. Leer = schlichte Fläche mit Play-Symbol." }
          - { name: image_alt, label: Bildbeschreibung, type: string }

      # ---- Einladung zum Feedback (unten auf der Seite Erfahrungen) ----
      - { name: invite_title, label: "Einladung: Überschrift", type: string, description: "Leer lassen = keine Einladung." }
      - { name: invite_text, label: "Einladung: Text", type: text }
      - { name: invite_button, label: "Einladung: Button-Text", type: string, description: "Führt zur Feedback-Seite." }

      # ---- Auch auf anderen Seiten zeigen ----
      - { name: show_on_start, label: "Auf der Startseite zeigen", type: boolean, description: "Zeigt die Zitate zum Durchblättern auf der Startseite." }
      - { name: show_on_sessions, label: "Auf der Seite 1:1 Sessions zeigen", type: boolean, description: "Zeigt die Zitate zum Durchblättern auch auf der Sessions-Seite." }
      - { name: all_link_text, label: "Link „Alle Erfahrungen ansehen“", type: string, description: "Erscheint auf Start/Sessions unter den Zitaten. Leer lassen = kein Link." }

