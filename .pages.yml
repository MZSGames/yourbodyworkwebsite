# Pages CMS – Editor für die Website von Ronja Sereinig
# Bearbeiten unter https://app.pagescms.org

media:
  input: src/images/uploads
  output: /images/uploads
  rename: safe
  categories: [image]

content:
  # ================= STARTSEITE =================
  - name: startseite
    label: Startseite
    type: file
    path: src/_data/home.json
    format: json
    fields:
      - name: hero
        label: "1 · Großer Einstieg (ganz oben)"
        type: object
        fields:
          - { name: eyebrow, label: Kleine Überzeile, type: string }
          - { name: title, label: Überschrift, type: text, description: "Mit Enter einen Zeilenumbruch setzen." }
          - { name: text, label: Text, type: text }
          - { name: button_text, label: Button-Text, type: string }
          - { name: note, label: Kursiver Satz unter dem Button, type: string }
          - { name: image, label: Bild, type: image, description: "Querformat, mind. 1800 px breit. Die Person sollte eher rechts im Bild sein – links steht der Text." }
          - { name: image_alt, label: Bildbeschreibung, type: string, description: "Kurz beschreiben, was zu sehen ist (für Google und blinde Menschen)." }

      - name: intro
        label: "2 · Einleitung (Frage & Text)"
        type: object
        fields:
          - { name: title, label: Überschrift, type: text, description: "Mit Enter einen Zeilenumbruch setzen." }
          - { name: text, label: Text, type: text, description: "Leerzeile = neuer Absatz." }
          - { name: accent, label: Hervorgehobener Satz (kursiv), type: string }

      - name: core
        label: "3 · Was ist CORE®?"
        type: object
        fields:
          - { name: eyebrow, label: Kleine Überzeile, type: string }
          - { name: title, label: Überschrift, type: text }
          - { name: text, label: Text, type: text, description: "Leerzeile = neuer Absatz." }
          - { name: button_text, label: Button-Text, type: string, description: "Leer lassen = kein Button." }
          - { name: button_link, label: Button-Link, type: string, description: "z. B. #sessions, #kontakt oder eine volle Web-Adresse." }
          - { name: image, label: Bild, type: image, description: "Querformat. Das Bild läuft nach rechts weich aus." }
          - { name: image_alt, label: Bildbeschreibung, type: string }

      - name: about
        label: "4 · Über mich"
        type: object
        fields:
          - { name: eyebrow, label: Kleine Überzeile, type: string }
          - { name: title, label: Überschrift, type: text }
          - { name: text, label: Text, type: text, description: "Leerzeile = neuer Absatz." }
          - { name: button_text, label: Button-Text, type: string, description: "Leer lassen = kein Button." }
          - { name: button_link, label: Button-Link, type: string }
          - { name: image, label: Bild, type: image, description: "Querformat. Das Bild läuft nach links weich aus." }
          - { name: image_alt, label: Bildbeschreibung, type: string }

      - name: sessions
        label: "5 · 1:1 Sessions"
        type: object
        fields:
          - { name: eyebrow, label: Kleine Überzeile, type: string }
          - { name: title, label: Überschrift, type: text }
          - name: items
            label: Merkmale
            description: "Ideal sind 3–5 Einträge."
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{text}"
            fields:
              - name: icon
                label: Symbol
                type: select
                options:
                  values:
                    - { name: herz, label: Herz }
                    - { name: blatt, label: Blatt }
                    - { name: uhr, label: Uhr }
                    - { name: ort, label: Ort / Pin }
                    - { name: sonne, label: Sonne }
                    - { name: hand, label: Hand mit Herz }
                    - { name: kalender, label: Kalender }
                    - { name: stern, label: Stern }
              - { name: text, label: Text, type: text, description: "Mit Enter einen Zeilenumbruch setzen." }
          - { name: button_text, label: Button-Text, type: string }

      - name: testimonials
        label: "6 · Erfahrungen anderer Frauen"
        type: object
        fields:
          - { name: eyebrow, label: Kleine Überzeile, type: string }
          - { name: image, label: Bild (links), type: image }
          - { name: image_alt, label: Bildbeschreibung, type: string }
          - name: items
            label: Erfahrungsberichte
            description: "Ohne Einträge wird der Bereich ausgeblendet."
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{quote}"
            fields:
              - { name: quote, label: Zitat (ohne Anführungszeichen), type: text }
              - { name: name, label: Name / Initialen (optional), type: string }
          - { name: feedback_link_text, label: Link zum Feedback-Formular, type: string, description: "Kleiner Link unter den Erfahrungsberichten. Leer lassen = kein Link." }

      - name: cta
        label: "7 · Abschluss (dunkler Bereich)"
        type: object
        fields:
          - { name: title, label: "Satz (kursiv, groß)", type: text }
          - { name: button_text, label: Button-Text, type: string }
          - { name: image, label: Bild, type: image }
          - { name: image_alt, label: Bildbeschreibung, type: string }

      - name: contact
        label: "8 · Kontakt"
        type: object
        fields:
          - { name: show, label: Bereich anzeigen, type: boolean }
          - { name: eyebrow, label: Kleine Überzeile, type: string }
          - { name: title, label: Überschrift, type: string }
          - { name: text, label: Text, type: text }
          - { name: button_text, label: Button-Text, type: string }
          - { name: mail_subject, label: Betreff der E-Mail, type: string, description: "Wird automatisch in die E-Mail eingesetzt, wenn jemand auf den Button klickt." }

  # ================= FEEDBACK =================
  - name: feedback
    label: Feedback-Seite
    type: file
    path: src/_data/feedback.json
    format: json
    fields:
      - { name: eyebrow, label: Kleine Überzeile, type: string }
      - { name: title, label: Überschrift, type: text }
      - { name: intro, label: Einleitungstext, type: text, description: "Leerzeile = neuer Absatz." }
      - { name: message_label, label: Beschriftung Textfeld, type: string }
      - { name: message_placeholder, label: Platzhalter im Textfeld, type: string }
      - { name: name_label, label: Beschriftung Namensfeld, type: string }
      - { name: consent_label, label: Text beim Häkchen (Veröffentlichung erlaubt), type: string }
      - { name: button_text, label: Button-Text, type: string }
      - { name: success_title, label: Überschrift nach dem Absenden, type: string }
      - { name: success_text, label: Text nach dem Absenden, type: text }
      - { name: error_text, label: Text bei einem Fehler, type: string }
      - { name: not_ready_text, label: Text solange kein Schlüssel eingetragen ist, type: string }

  # ================= RECHTLICHES =================
  - name: impressum
    label: Impressum
    type: file
    path: src/rechtliches/impressum.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Titel, type: string }
      - { name: body, label: Inhalt, type: rich-text }

  - name: datenschutz
    label: Datenschutzerklärung
    type: file
    path: src/rechtliches/datenschutz.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Titel, type: string }
      - { name: body, label: Inhalt, type: rich-text }

  # ================= EINSTELLUNGEN =================
  - name: einstellungen
    label: Einstellungen
    type: file
    path: src/_data/settings.json
    format: json
    fields:
      - { name: logo_name, label: Name (Logo), type: string }
      - { name: logo_subtitle, label: Untertitel (Logo), type: string }
      - { name: header_button_text, label: Button oben rechts, type: string }
      - { name: contact_link, label: "Wohin führen die Anfrage-Buttons?", type: string, description: "#kontakt = zum Kontaktbereich. Alternativ z. B. ein Buchungslink (Calendly o. Ä.)." }
      - { name: contact_email, label: E-Mail-Adresse, type: string }
      - { name: phone, label: Telefon (optional), type: string, description: "Leer lassen, wenn keine Nummer angezeigt werden soll." }
      - { name: feedback_key, label: Feedback-Schlüssel (Web3Forms), type: string, description: "Kostenlos auf web3forms.com anfordern – der Schlüssel kommt per E-Mail. Hier einfügen, dann ist das Feedback-Formular aktiv." }
      - { name: instagram_handle, label: Instagram-Name, type: string, description: "z. B. @ronja.sereinig" }
      - { name: instagram_url, label: Instagram-Link, type: string, description: "Leer lassen blendet Instagram aus." }
      - { name: instagram_label, label: Instagram-Beschriftung, type: string }
      - { name: site_title, label: "Seitentitel (Browser-Tab & Google)", type: string }
      - { name: meta_description, label: Beschreibung für Google, type: text, description: "ca. 150 Zeichen" }
      - { name: share_image, label: "Vorschaubild beim Teilen (WhatsApp, Facebook …)", type: image }
